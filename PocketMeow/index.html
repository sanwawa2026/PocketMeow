    <script>
      (function () {
        function isHmrNoise(str) {
          if (!str) return false;
          var s = String(str);
          return s.indexOf('WebSocket') !== -1 || s.indexOf('vite:ws') !== -1 || s.indexOf('@vite/client') !== -1;
        }
        window.addEventListener('unhandledrejection', function (e) {
          var m = (e.reason && (e.reason.message || String(e.reason))) || '';
          if (isHmrNoise(m)) {
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#EEF1F5] text-slate-900 antialiased selection:bg-amber-200 selection:text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
